version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: royalbull_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-royalbull_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-royalbull_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-royalbull_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U royalbull_user -d royalbull_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: royalbull_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://royalbull_user:royalbull_secure_password_2026@db:5432/royalbull_db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-ROYAL_BULL_CAPITAL_SUPER_SECURE_JWT_SECRET_KEY_2026_PRODUCTION_READY_987654321}
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      REFRESH_TOKEN_EXPIRE_DAYS: 14
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-Admin123!}
      ALLOWED_ORIGINS: http://localhost,http://localhost:80,http://localhost:5173
    ports:
      - "8000:8000"

  # React Frontend (Nginx static bundle)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: royalbull_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
